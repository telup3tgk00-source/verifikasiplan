version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: metrik_backend
    restart: always
    volumes:
      - ./backend/pln_kwh.db:/app/pln_kwh.db
      - ./backend/.env:/app/.env
      - ./backend/uploads:/app/uploads
    environment:
      - FRONTEND_URL=*
      - DEBUG=false

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metrik_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    container_name: metrik_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: metrik_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
