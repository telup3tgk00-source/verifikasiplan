version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: metrik_db
    restart: always
    environment:
      POSTGRES_USER: admin_pln
      POSTGRES_PASSWORD: RahasiaPassword123!
      POSTGRES_DB: pln_kwh
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: metrik_backend
    restart: always
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql://admin_pln:RahasiaPassword123!@db:5432/pln_kwh
      - SECRET_KEY=kunci-rahasia-production-pln-metrik
      - FRONTEND_URL=http://localhost
      - DEBUG=false
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metrik_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  postgres_data:
