version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: metrik_backend
    restart: always
    volumes:
      - ./backend/pln_kwh.db:/app/pln_kwh.db
      - ./backend/.env:/app/.env
      - ./backend/uploads:/app/uploads
    environment:
      - FRONTEND_URL=*
      - DEBUG=false

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metrik_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
