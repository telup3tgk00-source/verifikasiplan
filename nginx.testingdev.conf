# ==============================================================
# NGINX CONFIGURATION - TESTING / DEV SERVER (VPS HOSTINGER)
# ==============================================================

# ==================== 1. HTTP (PORT 80) ====================
# Melayani frontend & backend secara langsung di port 80.
# Container metrik_testingdev_frontend TIDAK akan crash walau sertifikat SSL belum dipasang.
# Mendukung ACME Challenge untuk pembuatan sertifikat SSL via Certbot.
server {
    listen 80;
    # Ganti dengan domain testing Anda atau biarkan '_' untuk akses langsung via IP VPS Hostinger
    server_name testingdev.metrikpln.co.id dev.metrikpln.co.id _;

    # Izinkan upload file data PLN besar (Excel/Foto hingga 200MB)
    client_max_body_size 200M;

    # Certbot ACME challenge untuk generate sertifikat Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # ================= MAINTENANCE MODE (OPSIONAL) =================
    # Aktifkan jika sedang maintenance dengan menghapus tanda '#'
    # error_page 503 @maintenance;
    # location @maintenance {
    #     root /usr/share/nginx/html;
    #     rewrite ^(.*)$ /maintenance.html break;
    # }

    # Frontend Single Page App (React / Vite)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # === EXPORT EXCEL — timeout khusus data ribuan baris ===
    location /api/export/ {
        proxy_pass http://backend:8000/api/export/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Matikan buffering agar stream chunk langsung diteruskan ke client
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeout 20 menit untuk export dataset besar
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_connect_timeout 120s;
    }

    # === BACKEND API PROXY ===
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Header identitas IP asli klien
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout untuk proses upload & background query
        proxy_read_timeout 300s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
    }
}

