# ==============================================================
# NGINX CONFIGURATION - TESTING & DEVELOPMENT (testingdev)
# Domain: prototypemetrik.co.id & www.prototypemetrik.co.id
# Target: VPS Hostinger (187.77.118.9)
# ==============================================================

# ==================== 1. HTTP (PORT 80) ====================
# Menerima request HTTP, melayani validasi Certbot, dan redirect ke HTTPS
server {
    listen 80;
    server_name prototypemetrik.co.id www.prototypemetrik.co.id _;

    # Izinkan upload file besar (hingga 200MB)
    client_max_body_size 200M;

    # Certbot ACME Challenge (validasi sertifikat SSL Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Redirect otomatis semua lalu lintas HTTP ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==================== 2. HTTPS (PORT 443) ====================
server {
    listen 443 ssl;
    server_name prototypemetrik.co.id www.prototypemetrik.co.id;

    # Sertifikat SSL Let's Encrypt (dari Certbot)
    ssl_certificate /etc/letsencrypt/live/prototypemetrik.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prototypemetrik.co.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Izinkan upload file data/foto besar (hingga 200MB)
    client_max_body_size 200M;

    # ================= MAINTENANCE MODE =================
    error_page 503 @maintenance;
    location @maintenance {
        root /usr/share/nginx/html;
        rewrite ^(.*)$ /maintenance.html break;
    }

    # Frontend Single Page Application (React / Vite)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # === DOKUMENTASI API SWAGGER / REDOC (Khusus Testing Dev) ===
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === EXPORT EXCEL — timeout khusus untuk dataset besar ===
    location /api/export/ {
        proxy_pass http://backend:8000/api/export/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nonaktifkan buffering agar chunk langsung dialirkan ke browser
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeout 20 menit untuk export ratusan ribu baris
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_connect_timeout 120s;
    }

    # === BACKEND REST API ===
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Waktu tunggu upload file besar & sinkronisasi proxy
        proxy_read_timeout 300s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
    }
}
