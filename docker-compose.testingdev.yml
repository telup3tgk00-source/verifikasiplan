version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: metrik_testingdev_db
    restart: always
    # Optimasi PostgreSQL untuk VPS Hostinger
    # - max_connections: batasan koneksi konkuren
    # - shared_buffers: alokasi memori buffer PostgreSQL
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=1GB
    environment:
      POSTGRES_USER: admin_testingdev
      POSTGRES_PASSWORD: TestingDevPassword123!
      POSTGRES_DB: pln_testingdev
    volumes:
      - testingdev_postgres_data:/var/lib/postgresql/data
    networks:
      - testingdev_network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: metrik_testingdev_backend
    restart: always
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql://admin_testingdev:TestingDevPassword123!@db:5432/pln_testingdev
      - SECRET_KEY=kunci-rahasia-testingdev-pln-metrik-2025
      - FRONTEND_URL=https://prototypemetrik.co.id
      - DEBUG=true
    depends_on:
      - db
    networks:
      - testingdev_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metrik_testingdev_frontend
    restart: always
    ports:
      # Port 80 & 443 untuk akses web (jika port 80/443 sudah dipakai aplikasi lain di VPS,
      # ubah ke misal "8080:80" dan "8443:443")
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.testingdev.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - testingdev_network

volumes:
  testingdev_postgres_data:

networks:
  testingdev_network:
    driver: bridge
